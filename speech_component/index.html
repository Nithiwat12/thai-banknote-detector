<!doctype html><html lang="th"><meta charset="utf-8">
<style>
body{font:15px sans-serif;margin:8px;color:#17324d}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:6px}
.switch{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;cursor:pointer;user-select:none}
.switch input{width:22px;height:22px;cursor:pointer;accent-color:#1f9d55}
.switch.small{font-size:14px;font-weight:400}
.switch.small input{width:18px;height:18px}
select{padding:6px;border-radius:7px;border:1px solid #aaa}
#status,#camera-status{margin:6px 0;font-size:13px}
</style>
<div class="bar">
<label class="switch"><input type="checkbox" id="camera-toggle"> เปิดกล้อง (ตรวจจับและพูดอัตโนมัติ)</label>
<label class="switch small"><input type="checkbox" id="sound-toggle" checked> เสียงประกาศ</label>
<select id="voices" aria-label="เลือกเสียงภาษาไทย"></select>
</div>
<div id="status" role="status">ติ๊ก “เปิดกล้อง” เพื่อเริ่ม ระบบจะพูดทันทีเมื่อพบธนบัตร</div>
<section id="camera-panel" hidden>
<div id="camera-status" role="status"></div>
<div style="position:relative;max-width:800px;margin:auto;background:#111">
<video id="camera-video" autoplay playsinline muted style="display:block;width:100%;max-height:540px;object-fit:contain"></video>
<canvas id="camera-overlay" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
</div></section>
<script src="camera.js"></script><script src="speech.js"></script></html>
